[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waddle"
version = "0.1.0"
description = "Compile lectures into PDF and manage password protection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NNJunior" }
]
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
encoding = ["chardet>=5"]
dev = ["build", "twine"]

[project.scripts]
waddle = "waddle.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waddle = ["py.typed"]